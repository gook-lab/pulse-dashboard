<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울 부동산 · 지도 탐색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0a0d14; --panel:#0f131c; --panel-2:#141924; --border:#1b2130; --row:#12161f;
    --text:#edf0f6; --text-sub:#8a93a6; --text-mut:#5e6879; --brand:#7c6cff; --radius:14px;
    --up:#16c784; --down:#ea3943;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --sans:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:#9d90ff;text-decoration:none} a:hover{color:#b9aeff}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#242c3b;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#33415a;background-clip:padding-box}

  .app{height:100vh;min-width:1320px;display:flex;flex-direction:column;overflow:hidden}

  /* ── topbar ─────────────────────────────── */
  .topbar{flex-shrink:0;height:60px;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--border);background:linear-gradient(#0d111a,#0b0e16)}
  .tt{display:flex;flex-direction:column;line-height:1.15}
  .tt b{font-size:15px;font-weight:800;letter-spacing:.01em}
  .tt span{font-size:11px;color:var(--text-mut)}
  .seg{display:inline-flex;gap:3px;padding:3px;background:var(--row);border:1px solid var(--border);border-radius:10px}
  .seg button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-sub);transition:background .15s,color .15s}
  .seg button:hover{color:var(--text)}
  .seg button[aria-selected="true"]{color:var(--text);background:rgba(124,108,255,.18)}
  .fgroup{display:flex;align-items:center;gap:8px}
  .flabel{font-size:11px;color:var(--text-mut);font-weight:600}
  .tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mut);border:1px solid var(--border);border-radius:6px;padding:3px 7px}

  /* ── body 3-col ─────────────────────────── */
  .body{flex:1;min-height:0;display:grid;grid-template-columns:352px minmax(0,1fr) 336px;gap:12px;padding:12px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;min-height:0}
  .ph{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border)}
  .ph .t{font-size:12px;font-weight:700;letter-spacing:.04em}

  /* breadcrumb */
  .crumb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
  .crumb button{font-size:12px;color:var(--text-sub);padding:3px 7px;border-radius:6px;font-weight:600}
  .crumb button:hover{color:var(--text);background:var(--panel-2)}
  .crumb .cur{color:var(--text);background:rgba(124,108,255,.14)}
  .crumb .sep{color:var(--text-mut);font-size:11px}

  /* list */
  .lhead{display:grid;gap:10px;padding:8px 14px;border-bottom:1px solid var(--row);font-size:10px;color:var(--text-mut);font-weight:600;flex-shrink:0}
  .lbody{flex:1;overflow-y:auto;min-height:0}
  .lrow{display:grid;gap:10px;align-items:center;width:100%;padding:9px 14px;border-bottom:1px solid var(--row);text-align:left;border-left:2px solid transparent;transition:background .12s}
  .lrow:hover{background:#12172a}
  .lrow.on{background:rgba(124,108,255,.10);border-left-color:var(--brand)}
  .lname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lsub{font-size:10.5px;color:var(--text-mut)}
  .lcell{display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.25}
  .bar{position:relative;height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;border-radius:3px}
  .rt{text-align:right}
  .val{font-family:var(--mono);font-size:12.5px;font-weight:600}
  .chg{font-family:var(--mono);font-size:11.5px;font-weight:700}
  .cnt{font-family:var(--mono);font-size:11px;color:var(--text-sub)}

  /* map */
  .mapwrap{position:relative}
  .mapbox{flex:1;min-height:0;position:relative}
  #map{width:100%;height:100%;display:block}
  #zoomG{transition:transform .62s cubic-bezier(.22,.61,.36,1)}
  .geo{cursor:pointer;transition:fill-opacity .15s}
  .dimmed{fill-opacity:.22}
  .glabel{fill:#e7ebf4;font-weight:700;paint-order:stroke;stroke:rgba(6,9,15,.78);stroke-width:2.6px;stroke-linejoin:round;pointer-events:none}
  .gsub{fill:#aab3c4;font-weight:600}
  .dbub{cursor:pointer}
  .dlabel{fill:#f2f5fb;font-weight:700;paint-order:stroke;stroke:rgba(6,9,15,.85);stroke-width:2.4px;stroke-linejoin:round;pointer-events:none}
  .tip{position:absolute;pointer-events:none;z-index:5;background:rgba(16,20,30,.97);border:1px solid #2a3346;border-radius:10px;padding:9px 11px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none;min-width:150px}
  .tip b{display:block;font-size:12.5px;margin-bottom:5px}
  .tiprow{display:flex;justify-content:space-between;gap:14px;font-size:11px;color:var(--text-sub);line-height:1.7}
  .legend{position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:7px;background:rgba(12,16,24,.86);border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:10.5px;color:var(--text-mut)}
  .lbox{width:20px;height:9px;border-radius:2px;display:inline-block}
  .mapnote{position:absolute;right:14px;bottom:12px;font-size:10px;color:var(--text-mut);background:rgba(12,16,24,.86);border:1px solid var(--border);border-radius:8px;padding:6px 9px}
  .backbtn{position:absolute;left:14px;top:12px;display:none;align-items:center;gap:6px;background:rgba(12,16,24,.9);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:600;color:var(--text-sub)}
  .backbtn:hover{color:var(--text);border-color:var(--brand)}

  /* stats */
  .stats{overflow-y:auto}
  .sect{padding:13px 14px;border-bottom:1px solid var(--row)}
  .sect:last-child{border-bottom:none}
  .sh{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--text-sub);margin-bottom:10px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .kpi{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 11px}
  .kpi .k{font-size:10.5px;color:var(--text-mut);margin-bottom:5px}
  .kpi .v{font-family:var(--mono);font-size:17px;font-weight:800;line-height:1}
  .kpi .s{font-size:10px;color:var(--text-mut);margin-top:4px}
  .arow{display:flex;align-items:center;gap:9px;padding:6px 0}
  .arow .an{width:74px;font-size:11.5px;color:var(--text-sub);flex-shrink:0}
  .arow .at{flex:1;height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden}
  .arow .af{height:100%;border-radius:4px;background:var(--brand)}
  .arow .av{font-family:var(--mono);font-size:11.5px;font-weight:600;width:52px;text-align:right}
  .toprow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--row)}
  .toprow:last-child{border-bottom:none}
  .toprow .rk{width:16px;font-family:var(--mono);font-size:10.5px;color:var(--text-mut)}
  .toprow .nm{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{padding:36px 14px;text-align:center;color:var(--text-mut);font-size:12px}

  /* ── 실거리 지도 ─────────────────────────── */
  #street{position:absolute;inset:0;display:none;z-index:2}
  .leaflet-container{background:#0a0d14;font-family:var(--sans)}
  .leaflet-tile-pane{filter:brightness(.52) saturate(.7) contrast(1.14)}
  .leaflet-control-attribution{background:rgba(12,16,24,.86)!important;color:var(--text-mut)!important;font-size:9.5px!important;border-radius:6px 0 0 0}
  .leaflet-control-attribution a{color:#9d90ff!important}
  .leaflet-bar,.leaflet-bar a{background:#141924!important;color:var(--text-sub)!important;border-color:var(--border)!important}
  .leaflet-bar a:hover{background:#1b2130!important;color:var(--text)!important}
  .pxb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;transform:translate(-50%,-100%)}
  .pxb .pill{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:rgba(19,24,36,.96);border:1px solid #2a3346;box-shadow:0 6px 18px rgba(0,0,0,.55)}
  .pxb .pn{font-size:11px;font-weight:600;color:#c7cedb}
  .pxb .pv{font-family:var(--mono);font-size:11.5px;font-weight:800;color:#fff}
  .pxb .stem{width:2px;height:7px;background:#2a3346}
  .pxb .dot{width:7px;height:7px;border-radius:50%;background:#7c6cff;border:2px solid #0a0d14}
  .pxb.on .pill{background:#7c6cff;border-color:#b9aeff}
  .pxb.on .pn{color:rgba(255,255,255,.85)}
  .pxb.on .stem{background:#b9aeff}
  .pxb.on .dot{background:#fff}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="tt"><b>서울 부동산 · 지도 탐색</b><span>시 → 구 → 동 → 단지 · 통계 드릴다운</span></div>
    <div class="fgroup"><span class="flabel">거래</span>
      <div class="seg" id="segDeal">
        <button data-v="jeonse" aria-selected="true">전세</button>
        <button data-v="maemae" aria-selected="false">매매</button>
        <button data-v="wolse" aria-selected="false">월세</button>
      </div>
    </div>
    <div class="fgroup"><span class="flabel">지도 지표</span>
      <div class="seg" id="segMetric">
        <button data-v="price" aria-selected="true">평균가</button>
        <button data-v="change" aria-selected="false">전월대비</button>
        <button data-v="count" aria-selected="false">거래량</button>
      </div>
    </div>
    <div class="fgroup"><span class="flabel">면적</span>
      <div class="seg" id="segArea">
        <button data-v="all" aria-selected="true">전체</button>
        <button data-v="s" aria-selected="false">~60㎡</button>
        <button data-v="m" aria-selected="false">60~85</button>
        <button data-v="l" aria-selected="false">85㎡~</button>
      </div>
    </div>
    <div style="flex:1"></div>
    <span class="tag" id="periodTag">2026.06 기준</span>
    <span class="tag">샘플 데이터</span>
  </header>

  <div class="body">

    <!-- 좌: 목록 -->
    <aside class="panel">
      <div class="crumb" id="crumb"></div>
      <div class="ph">
        <span class="t" id="listTitle">자치구 25</span>
        <div class="seg" id="segSort">
          <button data-v="price" aria-selected="true">가격</button>
          <button data-v="change" aria-selected="false">변동</button>
          <button data-v="count" aria-selected="false">거래</button>
        </div>
      </div>
      <div class="lhead" id="lhead"></div>
      <div class="lbody" id="list"></div>
    </aside>

    <!-- 중: 지도 -->
    <section class="panel mapwrap">
      <div class="ph">
        <span class="t" id="mapTitle">서울특별시 전역</span>
        <div style="display:flex;align-items:center;gap:9px">
          <span class="tag" id="mapMetricTag">평균 전세가</span>
          <div class="seg" id="segView">
            <button data-v="admin" aria-selected="true">행정구역</button>
            <button data-v="street" aria-selected="false">실거리 · 시세</button>
          </div>
        </div>
      </div>
      <div class="mapbox">
        <svg id="map" viewBox="0 0 760 620" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="street"></div>
        <button class="backbtn" id="back">← 서울 전체</button>
        <div class="tip" id="tip"></div>
        <div class="legend" id="legend"></div>
        <div class="mapnote" id="mapnote">구 경계: 행정안전부 행정구역 · 동 위치는 시안용 근사</div>
      </div>
    </section>

    <!-- 우: 통계 -->
    <aside class="panel stats" id="stats"></aside>

  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   상태
══════════════════════════════════════════════ */
const S = { deal:'jeonse', metric:'price', area:'all', sort:'price', gu:null, dong:null, hover:null, view:'admin' };

/* ══════════════════════════════════════════════
   샘플 데이터 (결정론적 생성)
   실제 구현 시 data.go.kr 실거래가 API로 대체
══════════════════════════════════════════════ */
const GU_BASE = [
  ['강남구',13.2,486,1.8],['서초구',12.4,402,1.2],['송파구',9.6,588,0.6],['용산구',9.1,214,2.4],
  ['성동구',8.4,352,1.5],['마포구',7.8,428,0.9],['광진구',7.5,286,-0.4],['양천구',7.2,394,0.3],
  ['동작구',7.0,318,0.7],['종로구',6.8,142,-1.1],['강동구',6.7,462,1.1],['중구',6.6,168,-0.6],
  ['영등포구',6.5,436,0.4],['서대문구',6.1,294,-0.8],['강서구',5.8,548,-0.2],['성북구',5.6,386,0.5],
  ['동대문구',5.4,342,-0.3],['구로구',5.1,368,-1.4],['은평구',5.0,412,0.2],['관악구',4.9,356,-0.9],
  ['중랑구',4.7,318,-1.2],['노원구',4.6,624,-0.5],['금천구',4.4,196,-1.8],['강북구',4.2,248,-2.1],
  ['도봉구',4.0,286,-1.6]
];
const DONGS = {
  '강남구':['역삼동','삼성동','대치동','청담동','논현동','개포동','도곡동','압구정동'],
  '서초구':['서초동','반포동','잠원동','방배동','양재동'],
  '송파구':['잠실동','문정동','가락동','방이동','석촌동','오금동'],
  '용산구':['이촌동','한남동','서빙고동','후암동','청파동'],
  '성동구':['성수동','옥수동','금호동','행당동','왕십리동'],
  '마포구':['상암동','공덕동','망원동','성산동','연남동','도화동'],
  '광진구':['광장동','자양동','구의동','화양동'],
  '양천구':['목동','신정동','신월동'],
  '동작구':['사당동','흑석동','상도동','노량진동'],
  '종로구':['평창동','부암동','명륜동','혜화동','사직동'],
  '강동구':['명일동','고덕동','상일동','천호동','암사동'],
  '중구':['신당동','황학동','회현동','을지로동'],
  '영등포구':['여의도동','당산동','문래동','신길동','대림동'],
  '서대문구':['홍제동','남가좌동','북아현동','연희동'],
  '강서구':['마곡동','가양동','등촌동','화곡동','방화동'],
  '성북구':['길음동','정릉동','돈암동','종암동','안암동'],
  '동대문구':['전농동','답십리동','장안동','회기동','이문동'],
  '구로구':['구로동','신도림동','개봉동','오류동','고척동'],
  '은평구':['응암동','불광동','녹번동','진관동','수색동'],
  '관악구':['봉천동','신림동','남현동'],
  '중랑구':['면목동','상봉동','중화동','묵동','신내동'],
  '노원구':['상계동','중계동','하계동','월계동','공릉동'],
  '금천구':['가산동','독산동','시흥동'],
  '강북구':['미아동','번동','수유동','우이동'],
  '도봉구':['창동','쌍문동','방학동','도봉동']
};
const BRANDS = ['자이','래미안','아이파크','푸르지오','e편한세상','힐스테이트','더샵','롯데캐슬','센트레빌','한신'];

function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// 거래유형 배수 (전세 기준) · 월세는 보증금(억) 기준으로 축소
const DEAL = { jeonse:{m:1, label:'전세', unit:'억'}, maemae:{m:1.92, label:'매매', unit:'억'}, wolse:{m:0.34, label:'월세 보증금', unit:'억'} };
const AREA_M = { all:1, s:0.72, m:0.98, l:1.42 };

function adj(eok){ return +(eok * DEAL[S.deal].m * AREA_M[S.area]).toFixed(1); }
function adjCount(c){ const f = S.area==='all'?1:S.area==='s'?0.34:S.area==='m'?0.42:0.24; return Math.round(c*f*(S.deal==='maemae'?0.55:S.deal==='wolse'?0.7:1)); }

// 구 데이터
function guData(){
  return GU_BASE.map(([name,eok,count,chg])=>({
    level:'gu', name, key:name,
    eok: adj(eok), count: adjCount(count),
    chg: +(chg + (S.deal==='maemae'?0.6:S.deal==='wolse'?-0.3:0)).toFixed(1)
  }));
}
// 동 데이터
function dongData(gu){
  const base = GU_BASE.find(g=>g[0]===gu); if(!base) return [];
  const r = rng(hash(gu+'|dong'));
  return (DONGS[gu]||[]).map(name=>{
    const f = 0.78 + r()*0.46;
    const cf = 0.10 + r()*0.24;
    return { level:'dong', name, key:gu+'>'+name, gu,
      eok:+(adj(base[1])*f).toFixed(1), count:Math.max(3,Math.round(adjCount(base[2])*cf)),
      chg:+(base[3] + (r()*3.2-1.6)).toFixed(1) };
  });
}
// 단지 데이터
function danjiData(gu,dong){
  const d = dongData(gu).find(x=>x.name===dong); if(!d) return [];
  const r = rng(hash(gu+dong+'|danji'));
  const n = 4 + Math.floor(r()*4);
  const short = dong.replace(/동$/,'');
  const out=[];
  for(let i=0;i<n;i++){
    const b = BRANDS[Math.floor(r()*BRANDS.length)];
    const f = 0.80 + r()*0.44;
    out.push({ level:'danji', name:`${short}${b}`, key:gu+'>'+dong+'>'+i, gu, dong,
      eok:+(d.eok*f).toFixed(1), count:Math.max(1,Math.round(d.count*(0.08+r()*0.22))),
      chg:+(d.chg + (r()*2.6-1.3)).toFixed(1),
      built: 1996 + Math.floor(r()*28), households: 180 + Math.floor(r()*1600) });
  }
  return out;
}

/* 현재 레벨의 목록 */
function currentRows(){
  if(S.dong) return danjiData(S.gu,S.dong);
  if(S.gu)   return dongData(S.gu);
  return guData();
}

const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
const priceColor=t=>`rgb(${lerp(28,124,t)},${lerp(36,108,t)},${lerp(62,255,t)})`;
const countColor=t=>`rgb(${lerp(24,34,t)},${lerp(40,190,t)},${lerp(58,150,t)})`;
function chgColor(v,maxAbs){
  const t=Math.min(1,Math.abs(v)/(maxAbs||3));
  const c=v>=0?[22,199,132]:[234,57,67];
  return `rgba(${c[0]},${c[1]},${c[2]},${(0.16+t*0.78).toFixed(2)})`;
}
const fmt=(n,d=1)=>Number(n).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const shortGu=n=>n.replace(/구$/,'');
const signStr=v=>(v>=0?'+':'')+v.toFixed(1)+'%';
const signCol=v=>v>0?'var(--up)':v<0?'var(--down)':'var(--text-mut)';

   지도
══════════════════════════════════════════════ */
const W=760,H=620;
let GEO=null, PROJ=null, PATH=null, FEAT=[], BOUNDS={}, CENT={}, RINGS={};
const svg=document.getElementById('map');
const tip=document.getElementById('tip');

fetch('maps/seoul-simple.json').then(r=>r.json()).then(geo=>{
  GEO=geo;
  PROJ=d3.geoMercator().fitExtent([[24,24],[W-24,H-46]],geo);
  PATH=d3.geoPath(PROJ);
  FEAT=geo.features.map(f=>({name:f.properties.name,code:f.properties.code,d:PATH(f)||'',f}));
  FEAT.forEach(x=>{ BOUNDS[x.name]=PATH.bounds(x.f); CENT[x.name]=PROJ(d3.geoCentroid(x.f)); RINGS[x.name]=screenRing(x.f); });
  buildMap(); render();
}).catch(()=>{ document.getElementById('mapnote').textContent='지도 데이터를 불러오지 못했습니다'; render(); });

// 폴리곤 최외곽 링을 화면좌표로
function screenRing(f){
  const g=f.geometry;
  const rings = g.type==='Polygon' ? [g.coordinates[0]] : g.coordinates.map(p=>p[0]);
  let best=rings[0];
  if(rings.length>1) best=rings.reduce((a,b)=>b.length>a.length?b:a,rings[0]);
  return best.map(c=>PROJ(c)).filter(Boolean);
}
function inside(pt,ring){
  let c=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>pt[1])!==(yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) c=!c;
  }
  return c;
}
// 구 내부에 결정론적으로 흩뿌린 동 위치
function dongPoints(gu,n){
  const ring=RINGS[gu]; if(!ring) return [];
  const [[x0,y0],[x1,y1]]=BOUNDS[gu];
  const r=rng(hash(gu+'|pts'));
  const pts=[], minD=Math.max(14,Math.min(x1-x0,y1-y0)/(n*0.62));
  let guard=0;
  while(pts.length<n && guard++<1200){
    const p=[x0+r()*(x1-x0), y0+r()*(y1-y0)];
    if(!inside(p,ring)) continue;
    if(pts.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<minD)) continue;
    pts.push(p);
  }
  while(pts.length<n) pts.push(CENT[gu]);
  return pts;
}

function buildMap(){
  svg.innerHTML='';
  const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.id='zoomG';
  const gGeo=document.createElementNS('http://www.w3.org/2000/svg','g'); gGeo.id='gGeo';
  const gLab=document.createElementNS('http://www.w3.org/2000/svg','g'); gLab.id='gLab';
  const gDong=document.createElementNS('http://www.w3.org/2000/svg','g'); gDong.id='gDong';
  g.append(gGeo,gDong,gLab); svg.append(g);

  FEAT.forEach(x=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',x.d); p.setAttribute('class','geo'); p.dataset.name=x.name;
    p.setAttribute('vector-effect','non-scaling-stroke');
    p.addEventListener('mouseenter',e=>{ S.hover=x.name; showTip(e,x.name); paint(); });
    p.addEventListener('mousemove',e=>moveTip(e));
    p.addEventListener('mouseleave',()=>{ S.hover=null; hideTip(); paint(); });
    p.addEventListener('click',()=>{ S.gu = (S.gu===x.name? null : x.name); S.dong=null; render(); });
    gGeo.append(p);
  });
}

let K=1;
function zoom(){
  const g=document.getElementById('zoomG'); if(!g) return;
  if(!S.gu){ K=1; g.setAttribute('transform','translate(0,0) scale(1)'); return; }
  const b=BOUNDS[S.gu]; if(!b) return;
  const bw=b[1][0]-b[0][0], bh=b[1][1]-b[0][1];
  K=Math.max(1,Math.min(4.6, Math.min(W/bw,H/bh)*0.58));
  const cx=(b[0][0]+b[1][0])/2, cy=(b[0][1]+b[1][1])/2;
  g.setAttribute('transform',`translate(${(W/2-K*cx).toFixed(1)},${(H/2-K*cy).toFixed(1)}) scale(${K.toFixed(3)})`);
}

function paint(){
  const rows=guData(); const byName={}; rows.forEach(r=>byName[r.name]=r);
  const eoks=rows.map(r=>r.eok), counts=rows.map(r=>r.count);
  const mn=Math.min(...eoks), mx=Math.max(...eoks);
  const cmx=Math.max(...counts);
  const amx=Math.max(...rows.map(r=>Math.abs(r.chg)),1);
  document.querySelectorAll('#gGeo .geo').forEach(p=>{
    const d=byName[p.dataset.name]; if(!d) return;
    let fill;
    if(S.metric==='price')      fill=priceColor(mx>mn?(d.eok-mn)/(mx-mn):.5);
    else if(S.metric==='count') fill=countColor(d.count/cmx);
    else                        fill=chgColor(d.chg,amx);
    p.setAttribute('fill',fill);
    const focus = !S.gu || S.gu===p.dataset.name;
    p.setAttribute('class','geo'+(focus?'':' dimmed'));
    p.setAttribute('fill-opacity', (S.gu && focus) ? '0.42' : '1');
    const hot = S.hover===p.dataset.name || S.gu===p.dataset.name;
    p.setAttribute('stroke',hot?'#edf0f6':'#1b2130');
    p.setAttribute('stroke-width',hot?2:0.9);
  });
}

function drawLabels(){
  const gLab=document.getElementById('gLab'), gDong=document.getElementById('gDong');
  if(!gLab) return;
  gLab.innerHTML=''; gDong.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  const rows=guData(); const byName={}; rows.forEach(r=>byName[r.name]=r);

  if(!S.gu){
    FEAT.forEach(x=>{
      const c=CENT[x.name], d=byName[x.name]; if(!c) return;
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',c[0]); t.setAttribute('y',c[1]); t.setAttribute('text-anchor','middle');
      t.setAttribute('class','glabel'); t.setAttribute('font-size','11');
      const a=document.createElementNS(NS,'tspan'); a.textContent=shortGu(x.name); a.setAttribute('x',c[0]);
      const b=document.createElementNS(NS,'tspan'); b.setAttribute('x',c[0]); b.setAttribute('dy','11');
      b.setAttribute('class','gsub'); b.setAttribute('font-size','9.5');
      b.textContent = S.metric==='count' ? `${d.count.toLocaleString()}건`
                    : S.metric==='change' ? signStr(d.chg) : `${fmt(d.eok)}억`;
      t.append(a,b); gLab.append(t);
    });
    return;
  }

  // 선택된 구: 동 버블
  const list=dongData(S.gu);
  const pts=dongPoints(S.gu,list.length);
  const mx=Math.max(...list.map(d=>d.count),1);
  const s=1/K;
  list.forEach((d,i)=>{
    const p=pts[i]; if(!p) return;
    const on = S.dong===d.name || S.hover===d.name;
    const r=(7+ (d.count/mx)*13) * s;
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r',r);
    c.setAttribute('fill', on ? '#b9aeff' : 'rgba(124,108,255,.92)');
    c.setAttribute('stroke', on ? '#ffffff' : 'rgba(10,13,20,.75)');
    c.setAttribute('stroke-width', (on?2:1)*s); c.setAttribute('class','dbub');
    c.addEventListener('mouseenter',e=>{ S.hover=d.name; showTipDong(e,d); paint(); drawLabels(); });
    c.addEventListener('mousemove',e=>moveTip(e));
    c.addEventListener('mouseleave',()=>{ S.hover=null; hideTip(); paint(); drawLabels(); });
    c.addEventListener('click',ev=>{ ev.stopPropagation(); S.dong=(S.dong===d.name?null:d.name); render(); });
    gDong.append(c);

    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',p[0]); t.setAttribute('y',p[1]+r+11*s); t.setAttribute('text-anchor','middle');
    t.setAttribute('class','dlabel'); t.setAttribute('font-size',(11*s).toFixed(2));
    t.setAttribute('stroke-width',(2.4*s).toFixed(2));
    const a=document.createElementNS(NS,'tspan'); a.textContent=d.name; a.setAttribute('x',p[0]);
    const b=document.createElementNS(NS,'tspan'); b.setAttribute('x',p[0]); b.setAttribute('dy',(11*s).toFixed(2));
    b.setAttribute('class','gsub'); b.setAttribute('font-size',(9.5*s).toFixed(2));
    b.textContent=`${fmt(d.eok)}억`;
    t.append(a,b); gLab.append(t);
  });
}

function showTip(e,name){

function showTipDong(e,d){

function moveTip(e){
  const box=svg.parentElement.getBoundingClientRect();
  let x=e.clientX-box.left+14, y=e.clientY-box.top+14;
  if(x+180>box.width) x-=196; if(y+120>box.height) y-=132;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.style.display='none'; }

/* ══════════════════════════════════════════════
   우측 통계 (선택 범위에 따라 세분화)
══════════════════════════════════════════════ */
function aggregate(rows){
  const total=rows.reduce((s,r)=>s+r.count,0);
  const w=total||1;
  return {
    eok:+(rows.reduce((s,r)=>s+r.eok*r.count,0)/w).toFixed(1),
    count:total,
    chg:+(rows.reduce((s,r)=>s+r.chg*r.count,0)/w).toFixed(1)
  };
}

function statsScope(){
  if(S.dong){
    const rows=danjiData(S.gu,S.dong);
    return {title:`${S.gu} ${S.dong}`, sub:`단지 ${rows.length}곳`, rows, agg:aggregate(rows), childLabel:'단지'};
  }
  if(S.gu){
    const rows=dongData(S.gu);
    return {title:S.gu, sub:`행정동 ${rows.length}곳`, rows, agg:aggregate(rows), childLabel:'행정동'};
  }
  const rows=guData();
  return {title:'서울특별시', sub:'자치구 25곳', rows, agg:aggregate(rows), childLabel:'자치구'};
}

function sparkPath(vals,w,h,pad){
  const mn=Math.min(...vals), mx=Math.max(...vals), sp=(mx-mn)||1;
  const X=i=>pad+(w-2*pad)*i/(vals.length-1), Y=v=>h-pad-(h-2*pad)*(v-mn)/sp;
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  return {line:pts.join(' '), area:`${X(0).toFixed(1)},${h} ${pts.join(' ')} ${X(vals.length-1).toFixed(1)},${h}`};
}

  const bmax=Math.max(1,...buckets.map(b=>b.n));

  // 면적대별
  const areaRows=[['~60㎡',0.72],['60~85㎡',0.98],['85~135㎡',1.42],['135㎡~',1.86]]
    .map(([k,f])=>({k, v:+((agg?.eok||0)/AREA_M[S.area]*f).toFixed(1)}));
  const amax=Math.max(...areaRows.map(a=>a.v),1);

  const top=[...rows].sort((a,b)=>b.eok-a.eok).slice(0,5);

  document.getElementById('stats').innerHTML=`
    <div class="ph"><span class="t">${sc.title} 통계</span><span class="tag">${sc.sub}</span></div>

      <div class="kpis">

        <div class="kpi"><div class="k">중위값</div><div class="v">${fmt(med)}<span style="font-size:11px;color:var(--text-mut)">억</span></div></div>
        <div class="kpi"><div class="k">거래건수</div><div class="v">${(agg?.count||0).toLocaleString()}</div><div class="s">${DEAL[S.deal].label} 기준</div></div>
        <div class="kpi"><div class="k">전월대비</div><div class="v" style="color:${signCol(agg?.chg||0)}">${signStr(agg?.chg||0)}</div><div class="s">상승 ${up} · 하락 ${down}</div></div>
      </div>
    </div>

    <div class="sect">
      <div class="sh">최근 12개월 추이</div>
      <svg viewBox="0 0 300 74" style="width:100%;height:74px;display:block">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7c6cff" stop-opacity=".34"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
        </linearGradient></defs>
        <line x1="0" y1="24" x2="300" y2="24" stroke="#1a2130"/><line x1="0" y1="50" x2="300" y2="50" stroke="#1a2130"/>

        <polyline points="${sp.line}" fill="none" stroke="#7c6cff" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-mut);margin-top:4px">
        <span>2025.07</span><span class="mono">${fmt(series[0])}억 → ${fmt(series[11])}억</span><span>2026.06</span>
      </div>
    </div>

    <div class="sect">
      <div class="sh">가격 분포 · ${sc.childLabel} 수</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:74px">
        ${buckets.map(b=>`
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end">
            <span style="font-size:9.5px;color:var(--text-mut)">${b.n||''}</span>

      <div style="font-size:10px;color:var(--text-mut);margin-top:6px">가로: 보증금 구간(억) · 세로: 해당 구간 ${sc.childLabel} 수</div>
    </div>

    <div class="sect">
      <div class="sh">면적대별 평균</div>
      ${areaRows.map(a=>`
        <div class="arow"><span class="an">${a.k}</span>
          <span class="at"><span class="af" style="width:${(a.v/amax*100).toFixed(0)}%"></span></span>
          <span class="av">${fmt(a.v)}억</span></div>`).join('')}
    </div>

    <div class="sect">
      <div class="sh">가격 상위 ${sc.childLabel}</div>
      ${top.map((r,i)=>`
        <div class="toprow">
          <span class="rk">${i+1}</span>
          <span class="nm">${r.level==='gu'?shortGu(r.name):r.name}</span>
          <span class="val">${fmt(r.eok)}억</span>
          <span class="chg" style="color:${signCol(r.chg)};width:48px;text-align:right">${signStr(r.chg)}</span>
        </div>`).join('')}
    </div>

    <div class="sect">
      <div class="sh">데이터 출처</div>
      <div style="font-size:11px;color:var(--text-mut);line-height:1.6">
        국토교통부 아파트 ${DEAL[S.deal].label} 실거래가 · 월 단위 집계<br>
        구 경계: 행정안전부 행정구역 경계<br>
        <span style="color:#8a93a6">시안의 수치는 샘플입니다.</span>
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════
   렌더 & 이벤트
══════════════════════════════════════════════ */
function renderLegend(){
  const rows=guData();
  const eoks=rows.map(r=>r.eok), counts=rows.map(r=>r.count);
  const el=document.getElementById('legend');
  if(S.metric==='price'){
    el.innerHTML=`<span>${fmt(Math.min(...eoks))}억</span>`+[0,.25,.5,.75,1].map(t=>`<span class="lbox" style="background:${priceColor(t)}"></span>`).join('')+`<span>${fmt(Math.max(...eoks))}억</span>`;
  }else if(S.metric==='count'){
    el.innerHTML=`<span>${Math.min(...counts)}건</span>`+[0,.25,.5,.75,1].map(t=>`<span class="lbox" style="background:${countColor(t)}"></span>`).join('')+`<span>${Math.max(...counts)}건</span>`;
  }else{
    const amx=Math.max(...rows.map(r=>Math.abs(r.chg)),1);
    el.innerHTML=`<span>하락</span><span class="lbox" style="background:${chgColor(-amx,amx)}"></span><span class="lbox" style="background:#141924"></span><span class="lbox" style="background:${chgColor(amx,amx)}"></span><span>상승</span>`;
  }
  document.getElementById('mapMetricTag').textContent =
    S.metric==='price'?`평균 ${DEAL[S.deal].label}가`: S.metric==='count'?'거래건수':'전월대비 변동';
}

/* ══════════════════════════════════════════════
   실거리 지도 (Leaflet + OSM) · 시세 말풍선
   실서비스에서는 네이버/카카오 지도 SDK로 교체
══════════════════════════════════════════════ */
let LMAP=null, LLAYER=null;
const toLL=pt=>{ const c=PROJ.invert(pt); return [c[1],c[0]]; };

function danjiPoints(gu,dong,n){
  const names=DONGS[gu]||[];
  const base=dongPoints(gu,names.length)[names.indexOf(dong)] || CENT[gu];
  const ring=RINGS[gu], r=rng(hash(gu+dong+'|dpts')), out=[];
  let guard=0;
  while(out.length<n && guard++<800){
    const p=[base[0]+(r()-0.5)*42, base[1]+(r()-0.5)*42];
    if(ring && !inside(p,ring)) continue;
    if(out.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<10)) continue;
    out.push(p);
  }
  while(out.length<n) out.push(base);
  return out;
}

function ensureLeaflet(){
  if(LMAP) return LMAP;
  LMAP=L.map('street',{zoomControl:true,attributionControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(LMAP);
  LLAYER=L.layerGroup().addTo(LMAP);
  return LMAP;
}

function updateStreet(){
  if(!GEO||!PROJ||typeof L==='undefined') return;
  const m=ensureLeaflet(); LLAYER.clearLayers();
  let items=[], center, zoom;

  if(S.dong){
    const rows=danjiData(S.gu,S.dong), pts=danjiPoints(S.gu,S.dong,rows.length);
    items=rows.map((r,i)=>({name:r.name,eok:r.eok,pt:pts[i],on:true}));
    center=toLL(pts[0]||CENT[S.gu]); zoom=16;
  }else if(S.gu){
    const rows=dongData(S.gu), pts=dongPoints(S.gu,rows.length);
    items=rows.map((r,i)=>({name:r.name,eok:r.eok,pt:pts[i],on:S.hover===r.name}));
    center=toLL(CENT[S.gu]); zoom=13;
  }else{
    items=guData().map(r=>({name:shortGu(r.name),eok:r.eok,pt:CENT[r.name],on:S.hover===r.name}));
    center=[37.5665,126.9780]; zoom=11;
  }

  items.forEach(it=>{
    if(!it.pt) return;
    const html=`<div class="pxb${it.on?' on':''}">`+
      `<div class="pill"><span class="pn">${it.name}</span><span class="pv">${fmt(it.eok)}억</span></div>`+
      `<div class="stem"></div><div class="dot"></div></div>`;
    L.marker(toLL(it.pt),{icon:L.divIcon({html,className:'',iconSize:[0,0]})}).addTo(LLAYER);
  });

  m.setView(center,zoom,{animate:false});
  setTimeout(()=>m.invalidateSize(),0);
}

function render(){
  document.getElementById('mapTitle').textContent = S.dong? `${S.gu} ${S.dong}` : S.gu? S.gu : '서울특별시 전역';
  const isStreet = S.view==='street';
  document.getElementById('street').style.display = isStreet?'block':'none';
  svg.style.display = isStreet?'none':'block';
  document.getElementById('legend').style.display = isStreet?'none':'flex';
  document.getElementById('back').style.display = (!isStreet && S.gu)? 'flex':'none';
  document.getElementById('mapnote').textContent = isStreet
    ? '시세 위치는 시안용 근사 · 실서비스는 네이버/카카오 지도 SDK + 실거래 좌표'
    : S.gu
      ? '동 위치는 시안용 근사 좌표 · 실제 구현 시 행정동 경계 필요'
      : '구 경계: 행정안전부 행정구역 · 동 위치는 시안용 근사';
  renderCrumb(); renderList(); renderStats();
  if(GEO){ paint(); zoom(); drawLabels(); renderLegend(); if(isStreet) updateStreet(); }
}

function bindSeg(id,key,after){
  document.getElementById(id).addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    S[key]=b.dataset.v;
    [...e.currentTarget.children].forEach(c=>c.setAttribute('aria-selected', String(c===b)));
    (after||render)();
  });
}
bindSeg('segDeal','deal'); bindSeg('segMetric','metric'); bindSeg('segArea','area'); bindSeg('segSort','sort');
bindSeg('segView','view');
document.getElementById('back').onclick=()=>{ S.gu=null; S.dong=null; render(); };
svg.addEventListener('click',e=>{ if(e.target===svg){ S.gu=null; S.dong=null; render(); } });
render();
</script>
